name: team_flow

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  image_picker: ^1.1.2
  pdf: ^3.13.0
  printing: ^5.15.0
  url_launcher: ^6.2.5
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  fl_chart: ^0.69.0
  file_selector: ^1.0.3
  file_selector_web: ^0.9.5
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/Cairo.ttf

  assets:
    - assets/images/logo.png
    - assets/images/logo1.png
    - assets/images/sidebar_background.png